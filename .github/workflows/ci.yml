name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Public, non-functional placeholders. Real values are only ever set in the hosting
      # provider, and none of these is a secret.
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high --omit=dev

      - name: Production build check
        run: npm run build

      # NEXT_PUBLIC_* values are inlined at build time; the browser suite needs a build
      # pointed at its local mock backend.
      - name: Build for browser tests
        run: npm run e2e:build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests (signed-out and mock-backed signed-in UI, accessibility, mobile viewports)
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs only when a staging deployment and test accounts are configured as environment
  # secrets. Never deploys anything.
  staging-e2e:
    if: ${{ vars.E2E_BASE_URL != '' }}
    needs: checks
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_OWNER_A_EMAIL: ${{ secrets.E2E_OWNER_A_EMAIL }}
      E2E_OWNER_A_PASSWORD: ${{ secrets.E2E_OWNER_A_PASSWORD }}
      E2E_MANAGER_A_EMAIL: ${{ secrets.E2E_MANAGER_A_EMAIL }}
      E2E_MANAGER_A_PASSWORD: ${{ secrets.E2E_MANAGER_A_PASSWORD }}
      E2E_EMPLOYEE_A_EMAIL: ${{ secrets.E2E_EMPLOYEE_A_EMAIL }}
      E2E_EMPLOYEE_A_PASSWORD: ${{ secrets.E2E_EMPLOYEE_A_PASSWORD }}
      E2E_EMPLOYEE_B_ID: ${{ vars.E2E_EMPLOYEE_B_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:staging
